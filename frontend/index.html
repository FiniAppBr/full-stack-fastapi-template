<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="theme-color" content="#000000" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minimal UI Kit</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Suppress known harmless Vue warnings from vite-plugin-checker overlay
      // See: https://github.com/fi3ework/vite-plugin-checker/issues/308
      const originalWarn = console.warn;
      console.warn = function(...args) {
        const msg = args[0]?.toString() || '';
        if (msg.includes('[Vue warn]') && msg.includes('ariaHidden')) {
          return; // Suppress aria-hidden Vue warnings from checker overlay
        }
        originalWarn.apply(console, args);
      };
    </script>
  </body>
</html>
